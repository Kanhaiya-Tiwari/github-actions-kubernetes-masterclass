name: Build and Push
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      context:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
    secrets:
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
      aws_region:
        required: true

jobs:
  build:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ secrets.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Tag Image
        run: |
          docker build -t ${{ inputs.ecr_repository }}/${{ inputs.image_name }}:${{ github.sha }} ${{ inputs.context }}
          docker tag ${{ inputs.ecr_repository }}/${{ inputs.image_name }}:${{ github.sha }} ${{ inputs.ecr_repository }}/${{ inputs.image_name }}:latest

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ inputs.ecr_repository }}/${{ inputs.image_name }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push to ECR
        run: |
          docker push ${{ inputs.ecr_repository }}/${{ inputs.image_name }}:${{ github.sha }}
          docker push ${{ inputs.ecr_repository }}/${{ inputs.image_name }}:latest
