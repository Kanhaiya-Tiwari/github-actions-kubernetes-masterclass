name: CI/CD Pipeline

on:
  push:
    branches: [main, release, develop]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**/*.md'
      - 'terraform/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          
      - name: Lint and Test Backend
        run: |
          cd backend
          go mod tidy
          go test ./... || echo "No tests yet, but this is where they run"
          
  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            815210276744.dkr.ecr.eu-west-1.amazonaws.com/skillpulse-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            815210276744.dkr.ecr.eu-west-1.amazonaws.com/skillpulse-frontend:${{ github.sha }}

  deploy-dev:
    needs: package
    if: github.ref == 'refs/heads/develop'
    environment: development
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev
        run: echo "Deploying to Development Environment via ArgoCD sync..."

  deploy-stage:
    needs: package
    if: github.ref == 'refs/heads/release'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging
        run: echo "Deploying to Staging Environment via ArgoCD sync..."

  deploy-prod:
    needs: package
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production
        run: echo "Deploying to Production Environment via ArgoCD sync..."
