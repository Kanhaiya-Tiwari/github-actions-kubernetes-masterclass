name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**/*.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            815210276744.dkr.ecr.eu-west-1.amazonaws.com/skillpulse-backend:latest
            815210276744.dkr.ecr.eu-west-1.amazonaws.com/skillpulse-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            815210276744.dkr.ecr.eu-west-1.amazonaws.com/skillpulse-frontend:latest
            815210276744.dkr.ecr.eu-west-1.amazonaws.com/skillpulse-frontend:${{ github.sha }}

      - name: Build and push database
        uses: docker/build-push-action@v7
        with:
          context: ./mysql
          push: true
          tags: |
            815210276744.dkr.ecr.eu-west-1.amazonaws.com/skillpulse-db:latest
            815210276744.dkr.ecr.eu-west-1.amazonaws.com/skillpulse-db:${{ github.sha }}
