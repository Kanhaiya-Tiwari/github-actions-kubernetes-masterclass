name: GitOps Update
on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
    secrets:
      gh_token:
        required: true

jobs:
  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.gh_token }}

      - name: Update Image Tags
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          # Update backend image tag
          sed -i "s|image: .*skillpulse-backend:.*|image: 815210276744.dkr.ecr.eu-west-1.amazonaws.com/skillpulse-backend:${{ github.sha }}|" k8s/skillpulse/08-backend-deployment.yaml
          # Update frontend image tag
          sed -i "s|image: .*skillpulse-frontend:.*|image: 815210276744.dkr.ecr.eu-west-1.amazonaws.com/skillpulse-frontend:${{ github.sha }}|" k8s/skillpulse/10-frontend-deployment.yaml

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/skillpulse/*.yaml
          git commit -m "chore(gitops): update ${{ inputs.env }} images to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push
